name: Cafam Nutricion Scraper

on:
  schedule:
    # GitHub cron en UTC. Colombia UTC-5 (sumar 5 horas).
    - cron: "0 12 * * *"  # 07:00 COL
    - cron: "0 17 * * *"  # 12:00 COL
    - cron: "0 23 * * *"  # 18:00 COL
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        run: |
          python scraper_cafam.py

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: cafam_nutricion_outputs
          path: outputs/
          retention-days: 14
